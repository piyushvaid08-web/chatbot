<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — Your File-Aware Assistant</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --panel-2: #1e2340;
      --border: #2a3052;
      --text: #e8eaf6;
      --muted: #9aa1c4;
      --accent: #7c6cff;
      --accent-2: #4ecdc4;
      --user: #2a3160;
      --bot: #1e2340;
      --danger: #ff6b6b;
      --ok: #5be08f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- header ---- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    header h1 span {
      color: var(--accent);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.on {
      background: var(--ok);
    }

    /* ---- layout ---- */
    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ---- sidebar ---- */
    #sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    #drop {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    #drop:hover,
    #drop.drag {
      border-color: var(--accent);
      background: var(--panel-2);
    }

    #drop input {
      display: none;
    }

    #drop strong {
      display: block;
      color: var(--text);
      margin-bottom: 4px;
    }

    #file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-2);
      border-radius: 8px;
      padding: 7px 10px;
    }

    .file-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .ext {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--accent-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    #empty-files {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .hint code {
      color: var(--accent-2);
    }

    /* ---- messages ---- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 78%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .bubble {
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user .bubble {
      background: var(--user);
      border-top-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--bot);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .msg.user .avatar {
      background: var(--accent);
    }

    .msg.bot .avatar {
      background: var(--accent-2);
      color: #0f1220;
    }

    .typing {
      color: var(--muted);
      font-style: italic;
      font-size: 13.5px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      background: var(--accent-2);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ---- input ---- */
    #input-bar {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      background: var(--panel);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #upload-plus {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #upload-plus:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    #input {
      flex: 1;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 14.5px;
      outline: none;
    }

    #input:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    #reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 14px;
      font-size: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Nova <span>·</span> file-aware assistant</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">checking…</span></div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <h2>Documents</h2>
      <div id="drop">
        <input type="file" id="file-input" multiple
          accept=".xls,.xlsx,.csv,.txt,.md,.log,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp" />
        <strong>Drop files here</strong>
        or click to browse
      </div>
      <div id="file-list"></div>
      <div id="empty-files" class="hint">
        Nothing loaded yet.<br />Upload Excel, CSV, PDF, Word, images, or text files, then ask questions about them —
        Nova answers from your files.
      </div>
      <div class="hint">Also works from the CLI: <code>python main.py data/</code></div>
      <button id="reset" title="Forget all documents and conversation">Reset memory</button>
    </aside>

    <main id="chat">
      <div id="messages"></div>
      <div id="input-bar">
        <button id="upload-plus" title="Upload files" aria-label="Upload files">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <input id="input" type="text" placeholder="Ask me anything about your files…" autocomplete="off" />
        <button id="send">Send</button>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msgBox = $("messages"), input = $("input"), sendBtn = $("send");
    const fileInput = $("file-input"), drop = $("drop"), fileList = $("file-list");
    const supported = ["xls", "xlsx", "csv", "txt", "md", "log", "pdf", "docx", "png", "jpg", "jpeg", "gif", "webp"];

    /* ---------- status ---------- */
    async function refreshStatus() {
      try {
        const r = await fetch("/api/status");
        const s = await r.json();
        $("dot").classList.toggle("on", s.connected);
        $("status-text").textContent = s.connected ? "AI connected" : "no API key set";
        renderFiles(s.files);
      } catch { /* server starting */ }
    }
    setInterval(refreshStatus, 5000);

    /* ---------- files ---------- */
    function renderFiles(files) {
      fileList.innerHTML = "";
      $("empty-files").style.display = files.length ? "none" : "block";
      files.forEach((f) => {
        const ext = (f.split(".").pop() || "").toUpperCase().slice(0, 4);
        const el = document.createElement("div");
        el.className = "file-item";
        el.innerHTML = `<span class="name">${esc(f)}</span><span class="ext">${esc(ext)}</span>`;
        fileList.appendChild(el);
      });
    }
    function esc(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function uploadFiles(fileArray) {
      const fd = new FormData();
      for (const f of fileArray) fd.append("files", f, f.name);
      const r = await fetch("/api/upload", { method: "POST", body: fd });
      const data = await r.json();
      let note = "";
      if (data.loaded.length) note = `📎 Loaded: ${data.loaded.join(", ")}`;
      if (data.errors.length) note += (note ? "\n" : "") + "⚠️ " + data.errors.join("\n");
      if (note) addMsg(note, "bot");
      refreshStatus();
      return data;
    }

    drop.addEventListener("click", () => fileInput.click());
    $("upload-plus").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadFiles([...fileInput.files]); fileInput.value = ""; });
    ["dragover", "dragenter"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", (ev) => {
      const files = [...ev.dataTransfer.files].filter((f) => supported.includes(f.name.split(".").pop().toLowerCase()));
      if (files.length) uploadFiles(files);
    });

    $("reset").addEventListener("click", async () => {
      await fetch("/api/reset", { method: "POST" });
      msgBox.innerHTML = "";
      addMsg("Memory cleared — all documents and the conversation are forgotten.", "bot");
      refreshStatus();
    });

    /* ---------- messages ---------- */
    function addMsg(text, who, streaming = false) {
      const wrap = document.createElement("div");
      wrap.className = `msg ${who}`;
      wrap.innerHTML = `<div class="avatar">${who === "user" ? "You" : "N"}</div><div class="bubble"></div>`;
      const bubble = wrap.querySelector(".bubble");
      bubble.textContent = text;
      if (streaming) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        bubble.appendChild(cursor);
      }
      msgBox.appendChild(wrap);
      msgBox.scrollTop = msgBox.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      addMsg(text, "user");
      const bubble = addMsg("Nova is typing", "bot", true);

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!resp.ok || !resp.body) throw new Error(`HTTP ${resp.status}`);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let full = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n")) !== -1) {
            const raw = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!raw.startsWith("data: ")) continue;
            const data = JSON.parse(raw.slice(6));
            if (data.content) { full += data.content; bubble.textContent = full; msgBox.scrollTop = msgBox.scrollHeight; }
            if (data.done) { bubble.textContent = full; }
            if (data.error) { bubble.textContent = "⚠️ " + data.error; }
          }
        }
      } catch (e) {
        bubble.textContent = "⚠️ Could not reach the server: " + e.message;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    /* welcome message */
    addMsg("Hi! I'm Nova 👋 — a friendly assistant that reads your files. Drop an Excel sheet, CSV, PDF, or Word doc into the sidebar and ask me anything about it.", "bot");
    refreshStatus();
  </script>
</body>

</html>
